<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroGames | Catálogo de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎮 RetroGames</h1>
        <p>Uma coleção de jogos para relembrar grandes aventuras!</p>
    </header>

    <main class="container">
        <div class="titulo-secao">
            <h2>Nosso catálogo</h2>
            <button id="btnCadastrar" type="button">+ Cadastrar Jogo</button>
        </div>

        <section id="listarJogos" class="listar-jogos">
            <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        </section>
    </main>

    <dialog id="modalCadastro">
        <form id="formJogo">
            <h2>Cadastrar Jogo</h2>

            <label for="titulo">Título do jogo</label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                placeholder="Digite o título do jogo"
                required
            >

            <label for="plataforma">Plataforma</label>
            <input
                type="text"
                id="plataforma"
                name="plataforma"
                placeholder="Ex: Super Nintendo"
                required
            >

            <label for="desenvolvedora">Desenvolvedora</label>
            <input
                type="text"
                id="desenvolvedora"
                name="desenvolvedora"
                placeholder="Digite a desenvolvedora"
                required
            >

            <label for="imagem_url">URL da imagem</label>
            <input
                type="url"
                id="imagem_url"
                name="imagem_url"
                placeholder="Cole o link da imagem"
                required
            >

            <label for="preco">Preço (R$)</label>
            <input
                type="number"
                id="preco"
                name="preco"
                placeholder="Ex.: 99.90"
                min="0"
                step="0.01"
                required
            >

            <div class="botoes-formulario">
                <button id="btnCancelar" type="button">Cancelar</button>
                <button type="submit">Salvar jogo</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
